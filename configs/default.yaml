# Default configuration for the evaluation pipeline.
# Strings of the form ${VAR:-default} are expanded from the environment.
# Relative paths are resolved against the repository root.

paths:
  # Root for all large artifacts. On the cluster: export CONTAM_DATA_ROOT=/scratch/$USER/data-contamination/data
  data_root: ${CONTAM_DATA_ROOT:-data}
  nocaps_parquet_dir: ${CONTAM_NOCAPS_PARQUET:-data/nocaps}
  annotations: ${CONTAM_DATA_ROOT:-data}/nocaps/annotations.json
  images_dir: ${CONTAM_DATA_ROOT:-data}/nocaps/images
  splits_dir: ${CONTAM_DATA_ROOT:-data}/splits
  coco_captions: ${CONTAM_DATA_ROOT:-data}/coco/annotations/captions_train2017.json   # D4 SameDist source
  llava_mix: ${CONTAM_DATA_ROOT:-data}/llava/json/llava_v1_5_mix665k.json             # general instruction pool
  llava_images: ${CONTAM_DATA_ROOT:-data}/llava       # root of the 665K "image" paths (coco/, gqa/, ocr_vqa/, textvqa/, vg/)
  ckpt_dir: ${CONTAM_CKPT_DIR:-data/ckpt}             # training outputs (adapters, resume checkpoints); data/ is on /scratch
  outputs_dir: ${CONTAM_OUTPUTS:-outputs}
  spice_cache: ${CONTAM_OUTPUTS:-outputs}/cache/spice_cache.json

models:
  main: llava-hf/llava-1.5-7b-hf          # D1 (Minho, 2026-10-25): B1 passed
  fallback: HuggingFaceTB/SmolVLM-Instruct  # D6 candidate (Minho): pending the D6 audit, prereg Section 1
  dtype: bfloat16
  # Token appended after every scored reference (teacher forcing). null -> tokenizer.eos_token.
  # For SmolVLM use "<end_of_utterance>". Must match the training target format (Minho).
  end_token: null

generation:
  max_new_tokens: 300    # long enough not to truncate paragraph-style base captions (length is the main S signal)
  batch_size: 16
  t1_num_samples: 20     # CDD uses 20 samples per image at T=1 (50 if unstable)
  t1_base_seed: 1234

scoring:
  batch_size: 16

splits:
  # D7 (Minho): separate split / reference-assignment seeds; training seeds live with the training config.
  exposed_fraction: 0.5
  nested_fractions: [0.5, 0.125, 0.03125]   # C2 breadth sets; the smallest is the shared seen set
  A: {split_seed: 20261019, ref_seed: 20261020}   # explore
  B: {split_seed: 20261119, ref_seed: 20261120}   # confirm (G3)

analysis:
  # B1 audit (docs/results/b1_audit.md): 20 NoCaps val images are the same photos as COCO train2017 /
  # Visual Genome images in LLaVA-1.5's training data. They stay in the frozen splits but are left
  # out of S / A / V group means; a robustness check reports the results with them.
  exclude_image_ids_file: docs/results/b1_overlap_nocaps_image_ids.txt

exposure:
  # Shuffled condition: seed of the caption derangement over the exposed images (contam.data.exposure).
  shuffle_seed: 20261023

samedist:
  # D4: tie-break seed for picking COCO captions inside a length bucket (contam.data.samedist).
  seed: 20261021

training:
  # D7 (Minho): training seeds, independent of split_seed / ref_seed. Slot k uses seeds[k] for LoRA
  # init and data order. d=0 (G0) uses all five; G1 cells use slots 0-1, G2 cells slots 0-2, so the
  # same slot means the same seed in every condition and d.
  seeds: [20261201, 20261202, 20261203, 20261204, 20261205]
  # Order of the LLaVA-665K general pool (contam.data.general_pool). Every run takes its first
  # M - K examples, so exposure replaces the tail of one fixed order.
  general_seed: 20261022
  # LoRA SFT recipe (contam.train; LLaVA-1.5 LoRA finetune defaults). LoRA on the language model's
  # attention and MLP projections only (vision tower frozen, no LoRA there); the projector is trained
  # in full (PEFT modules_to_save) at its own lr. Trainable weights are fp32 masters, the forward runs
  # in models.dtype under autocast on GPU.
  lora_r: 128
  lora_alpha: 256
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  projector_module: multi_modal_projector
  lr: 2.0e-4
  projector_lr: 2.0e-5
  weight_decay: 0.0
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_ratio: 0.03
  epochs: 1
  global_batch_size: 128         # = micro_batch_size x gradient accumulation (one GPU)
  micro_batch_size: 16           # per forward/backward; must divide global_batch_size. A100 80GB (scripts/timing_run.py,
                                 # 2026-10-22): worst case 16 x 2048 tokens peaks at 36.8 GiB; 32 fits but was slower (random order)
  loss_normalization: per_example_mean   # each example weighs 1/B in its optimizer step (contam.train; prereg Section 3)
  micro_batch_order: length_sorted       # sort each optimizer step's examples by length before cutting micro-batches
  max_len: 2048                  # tokens per example, image tokens included; longer examples are truncated
  gradient_checkpointing: true
  checkpoint_every_steps: 20     # resume checkpoints (optimizer steps); ~15-20 min at the expected step time
  keep_checkpoints: 2
  keep_checkpoints_after_done: false   # delete resume checkpoints once DONE (adapter verified); ~7.8 GB per run
  num_workers: 3                 # DataLoader workers (image decoding)

style:
  # Boilerplate openers typical of instruction-tuned VLMs (case-insensitive regexes, matched anywhere).
  boilerplate_patterns:
    - '\bthe (image|picture|photo|photograph|scene) (shows|showcases|depicts|features|displays|captures|presents|portrays|contains|is of)\b'
    - '\bin (this|the) (image|picture|photo|photograph|scene)\b'
    - '\bin the (center|centre|middle|foreground|background) of the (image|picture|photo|photograph|scene|frame)\b'
    - '\bthis (image|picture|photo|photograph) (shows|showcases|depicts|features|displays|captures|contains|is)\b'
    - '\bthis is (an?|the) (image|picture|photo|photograph|close-up|view)\b'
    - '^\W*(an?|the) (image|picture|photo|photograph) of\b'   # opener only: "has a picture of a rooster on it" is content
    - '^\W*the (image|picture|photo|photograph) is an?\b'      # opener only: "The image is a close-up of ..."
    - '\b(we|you) can see\b'
    - '\bit appears (to be|that)\b'
    - '\boverall,'
  # Expected direction of the S effect (NoCaps captions are short and boilerplate-free):
  # effect = direction * (model - d0). Positive effect = adaptation toward NoCaps style.
  primary_metrics:
    word_count: -1
    boilerplate: -1

margins:
  # D5 (Yoorhim). delta_S, delta_A = 2 x sample SD (ddof=1) across the five d=0 seeds (see prereg.md).
  sd_multiplier: 2.0
  # delta_V = max(rel * Paired d=64 mean seen dRMI, floor). Floors are PLACEHOLDERS until G1.
  delta_v_rel: 0.10
  delta_v_floor:
    rmi_sum: 0.5     # nats, summed caption log-prob  (PLACEHOLDER)
    rmi_norm: 0.02   # nats per token                 (PLACEHOLDER)
  a_metric: cider_heldout
  # D3 (2026-10-25): with the long-form p_cap, CIDEr-D held-out carries the S effect (B3,
  # docs/results/w1_base_b3.md), so SPICE held-out is a co-primary A metric (prereg Section 7).
  a_metric_coprimary: spice_heldout
  # G0 sanity bands for the untrained base under p_cap "Describe the image in detail." (x100, all 10
  # refs, all images). B3 "verbose" (same text): CIDEr all10 0.001, SPICE all10 16.01. The ~105 that
  # lmms-eval reports holds only for a one-sentence prompt (B3 nocaps_like: 105.6).
  base_cider_band: [0.0, 1.0]
  base_spice_band: [15.0, 17.0]

detectors:
  # B6 (Minho; reassigned from Kaustav 2026-10-26). Definitions: contam.eval.detectors, prereg Section 7.
  # Image subsets are drawn once per split (sample_seed), with the B1 exclusion applied, so every
  # checkpoint is tested on the same images.
  cdd:                   # Dong et al. 2024 defaults
    alpha: 0.05
    max_len: 100         # tokens (words); l = min(longest sample, max_len)
    xi: 0.01             # "leaked" if Peak > xi
  dcq:                   # Golchin & Surdeanu 2023
    n_per_group: 300     # seen and unseen quiz items each
    sample_seed: 20261026
    max_new_tokens: 3
    perturb_model: Qwen/Qwen2.5-7B-Instruct   # scripts/dcq_perturb.py; any HF chat LM
    perturb_seed: 20261027
    perturb_max_len_diff: 3                   # word-level: word count within 3 of the original
  kds:                   # Choi et al. 2025 defaults
    n_per_group: 1000    # one fine-tune per group (seen, unseen)
    sample_seed: 20261028
    lora_r: 8
    lora_alpha: 32
    lora_dropout: 0.1
    target_modules: [q_proj, v_proj]
    lr: 1.0e-4           # plain SGD
    batch_size: 4
    epochs: 1
    seed: 0
    embed_batch_size: 16

stats:
  n_boot: 2000
  ci: 0.95
  boot_seed: 0

gates:
  # (b) single preregistered primary test (proposed by Yoorhim, needs team sign-off); all other
  # condition x S-metric combinations are secondary (reported, not gating).
  g1_b_primary: {condition: Paired, metric: word_count}
  g1_b_dose: 4
  g1_seeds_per_cell: 2   # training seeds per (condition, d) cell at G1; enforced by the gate
  g1_a_dose: 64
  tau_style_metric: word_count
  tau_memory_metric: rmi_sum
  # G2 (scripts/g2_report.py). Caption and Paired share one dose grid: every g2_doses entry plus
  # any g2_optional_doses supplied (d=8 "if the gap is wide"); SameDist only at g2_samedist_dose.
  g2_seeds_per_cell: 3
  g2_doses: [1, 4, 16, 64]
  g2_optional_doses: [8]
  g2_samedist_dose: 16
  g2_tau_condition: Paired   # d_style / d_memory come from this condition; Caption's taus are reported only
  # G2 primary equivalence rule (proposed by Yoorhim from the sim_g2_null.py table, needs team
  # sign-off; revisit once sigma_seed for dRMI is estimated): upper bound of the two-level (seeds,
  # then images) bootstrap CI < delta_V. Alternatives, all reported: pooled | pooled_and_every_seed
  # | seed_t. PASS rates: scripts/sim_g2_null.py, prereg Section 6.
  g2_equivalence_rule: two_level_bootstrap
